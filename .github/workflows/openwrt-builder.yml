#
# Qihoo 360T7 UBI / ImmortalWrt 25.12 / PassWall + Xray + DDNSTO
#

name: Build 360T7 ImmortalWrt

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  CCACHE_DIR: /workdir/openwrt/.ccache
  CCACHE_COMPRESS: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          df -hT "$PWD"
          git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
          ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/openwrt/.ccache
            /workdir/openwrt/dl
            /workdir/openwrt/tmp/go-build
          key: openwrt-360t7-${{ github.run_id }}
          restore-keys: |
            openwrt-360t7-

      - name: Load custom feeds
        run: |
          [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Inject DDNSTO token and root password
        env:
          DDNSTO_TOKEN: ${{ secrets.DDNSTO_TOKEN }}
          ROOT_PASSWORD: ${{ secrets.ROOT_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/files/etc/config" "$GITHUB_WORKSPACE/files/etc/uci-defaults"
          {
            echo "config ddnsto"
            echo "    option enabled '1'"
            echo "    option token '${DDNSTO_TOKEN}'"
            echo "    option index '0'"
            echo "    option logger '0'"
            echo "    option feat_enabled '0'"
          } > "$GITHUB_WORKSPACE/files/etc/config/ddnsto"

          cat > "$GITHUB_WORKSPACE/files/etc/uci-defaults/90-set-root-password" <<EOF
          #!/bin/sh
          (echo '${ROOT_PASSWORD}'; sleep 1; echo '${ROOT_PASSWORD}') | passwd root >/dev/null 2>&1
          rm -f /etc/uci-defaults/90-set-root-password
          exit 0
          EOF
          chmod +x "$GITHUB_WORKSPACE/files/etc/uci-defaults/90-set-root-password"

      - name: Load custom configuration
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
          chmod +x "$DIY_P2_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: Download packages
        run: |
          cd openwrt
          make defconfig
          make download -j8 || make download -j1 V=s

      - name: Compile firmware
        run: |
          cd openwrt
          echo "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 || make -j1 V=s

      - name: Collect firmware
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find openwrt/bin/targets -type f \
            \( -name '*squashfs-sysupgrade*' \
            -o -name '*initramfs*' \
            -o -name '*preloader*' \
            -o -name '*uboot*' \
            -o -name 'sha256sums' \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-ImmortalWrt-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
